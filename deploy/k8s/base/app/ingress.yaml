apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: project-f
  annotations:
    # TLS terminates with the shared origin cert (tryalynx-origin-tls); cert-manager is not used here.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: replace-me.example.com # overwritten by overlay
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: project-f
                port:
                  name: http
  tls:
    - hosts:
        - replace-me.example.com # overwritten by overlay
      secretName: tryalynx-origin-tls
